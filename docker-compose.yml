services:
  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "127.0.0.1:3300:3000"
      - "127.0.0.1:4318:4318"
    volumes:
      - lgtm-data:/data
  app:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./telemetry.py:/app/telemetry.py:ro
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      OTLP_ENDPOINT: http://lgtm:4318
    command: ["python", "-u", "telemetry.py"]
    depends_on:
      - lgtm
volumes:
  lgtm-data:

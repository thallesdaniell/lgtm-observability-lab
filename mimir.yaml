multitenancy_enabled: false
server:
  http_listen_port: 9009
ingester:
  ring:
    replication_factor: 1
    kvstore:
      store: inmemory
blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  tsdb:
    dir: /data/tsdb
  bucket_store:
    sync_dir: /data/tsdb-sync
compactor:
  data_dir: /data/compactor
store_gateway:
  sharding_ring:
    replication_factor: 1
